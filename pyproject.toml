[project]
name = "audio-probes"
version = "0.1.0"
description = "How much of a physical audio property survives in each Whisper encoder layer, versus what an audio-LLM reports."
requires-python = "==3.12.*"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pyroomacoustics==0.10.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "torch==2.14.1",
    "transformers==5.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_probes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
